name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # public/ and src/engine/*.generated.ts are build outputs (gitignored): generate them before
      # anything type-checks or tests against them. Also checks the engine pin and overlay version.
      - run: npm run sync-assets
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run test:basics

  e2e:
    name: End-to-end (Chrome + Firefox)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-assets
      - run: npx playwright install --with-deps chromium
      # The engine's verdicts on the pilot criteria, against the recorded baseline.
      - run: npm run golden:v5
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: test/e2e/out/
