<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opquast — Préférences</title>
    <!-- WXT builds options_ui from this page: a full tab, not the browser's small embedded frame -->
    <meta name="manifest.open_in_tab" content="true" />
    <style>
      :root {
        color-scheme: light dark;
        /* AA contrast in both schemes: grey 7:1 on white, the light tints on a dark background */
        --muted: #595959;
        --ok: #1a7f37;
        --bad: #b3261e;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.3rem;
      }
      .row {
        margin: 0.8rem 0;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      label {
        user-select: none;
      }
      select {
        font: inherit;
        padding: 0.2rem 0.4rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #b0b0b0;
          --ok: #57d07a;
          --bad: #ff8a80;
        }
      }
      .hint,
      .note {
        color: var(--muted);
        font-size: 0.9em;
        margin-top: 1.5rem;
      }
      .note {
        margin: -0.4rem 0 0.8rem 1.6rem;
        font-size: 0.9em;
      }
      #saved,
      #historyCleared {
        color: var(--ok);
        margin-left: 0.5rem;
      }
      fieldset {
        margin: 0.8rem 0;
        border: 1px solid #8884;
        border-radius: 6px;
        padding: 0.6rem 0.9rem;
      }
      legend {
        padding: 0 0.3rem;
        color: var(--muted);
      }
      fieldset label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.35rem 0;
      }
      #hostAccess.missing {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optTitle">Opquast — Préférences</h1>

    <fieldset>
      <legend data-i18n="optSiteAccess">Accès aux sites</legend>
      <p id="hostAccess"></p>
      <button id="grantHosts" type="button" data-i18n="optGrant" hidden>
        Autoriser l'accès à tous les sites
      </button>
    </fieldset>

    <fieldset id="checklists">
      <legend data-i18n="optChecklists">Référentiels à utiliser</legend>
    </fieldset>

    <div class="row">
      <label for="slug" data-i18n="optDefault">Checklist par défaut</label>
      <select id="slug"></select>
    </div>

    <div class="row">
      <label for="lang" data-i18n="langLabel">Langue</label>
      <select id="lang">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="row">
      <input type="checkbox" id="autoRun" />
      <label for="autoRun" data-i18n="optAutoRun">Lancer les tests à l'ouverture</label>
    </div>

    <div class="row">
      <input type="checkbox" id="showThemas" />
      <label for="showThemas" data-i18n="optShowThemas">Afficher la colonne « Rubrique »</label>
    </div>

    <div class="row">
      <input type="checkbox" id="participateFeedback" />
      <label for="participateFeedback" data-i18n="optParticipate"
        >Participer à l'amélioration de cette application</label
      >
    </div>
    <p id="participateKept" class="note" role="status" hidden></p>

    <fieldset>
      <legend data-i18n="optData">Données locales</legend>
      <p id="historyCount"></p>
      <button id="clearHistory" type="button" data-i18n="optClearHistory">
        Effacer l'historique des analyses
      </button>
      <span id="historyCleared" role="status"></span>
    </fieldset>

    <p class="hint">
      <span data-i18n="optHint"
        >Les préférences sont enregistrées automatiquement et appliquées au panneau DevTools «
        Opquast ».</span
      >
      <span id="saved" role="status"></span>
    </p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
